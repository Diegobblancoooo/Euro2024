name: Deploy Araguaney Natural to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/araguaney-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Araguaney branch
        uses: actions/checkout@v6
        with:
          ref: araguaney-natural

      - name: Prepare site
        run: |
          mkdir -p _site
          cp araguaney-natural/prototipo-v2.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
